version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: znotify_db
    environment:
      POSTGRES_DB: znotify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: znotify_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: znotify_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/znotify
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=SUPER_SECRET_SECURITY_KEY_FOR_JWT_TOKEN_GENERATION_32_CHARS
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: znotify_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/znotify
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=SUPER_SECRET_SECURITY_KEY_FOR_JWT_TOKEN_GENERATION_32_CHARS
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    container_name: znotify_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
